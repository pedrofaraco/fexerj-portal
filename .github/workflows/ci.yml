name: CI

on:
  push:
    branches: [master, develop, feature/**, fix/**, refactor/**, chore/**]
  pull_request:
    branches: [master, develop]

jobs:
  supply-chain-audit:
    name: Supply chain audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Blocking: only dependencies that reach the running service.
      - name: pip-audit (runtime — blocking)
        run: pip-audit -r requirements.txt

      # Advisory: dev tooling (pytest, mypy, ruff, httpx) never reaches the
      # server. requirements-dev.txt includes requirements.txt, so this pass
      # is a superset — nothing drops out of view.
      - name: pip-audit (dev tooling — advisory)
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements-dev.txt
        continue-on-error: true

      - uses: actions/setup-node@v6
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        if: ${{ !cancelled() }}
        run: npm ci
        working-directory: frontend

      # Blocking: the `dependencies` field and its transitive closure — react,
      # react-dom, jszip, prop-types and the packages they pull in. Note this is
      # a proxy for browser exposure, not a synonym: tailwindcss is a
      # devDependency and the CSS it generates ships to users too.
      - name: npm audit (runtime — blocking)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
        working-directory: frontend

      # Advisory: build and test tooling (eslint, vite, jsdom). Not a lower risk
      # class — vite and its plugins execute during the Docker frontend build and
      # their output is served verbatim. It is non-blocking because the lockfile
      # is pinned and npm ci is deterministic: exposure requires a lockfile
      # change, which only arrives through a reviewable Dependabot PR.
      - name: npm audit (dev tooling — advisory)
        if: ${{ !cancelled() }}
        run: npm audit
        working-directory: frontend
        continue-on-error: true

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v

  lint-python:
    name: Python linting and type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check backend/ tests/

      - name: Type check with mypy
        run: mypy backend/

  lint-scripts:
    name: Shell script linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  test-frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
